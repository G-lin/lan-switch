name: Build macOS App

on:
  push:
    branches:
      - main
    paths:
      - 'main.swift'
      - 'Info.plist'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'main.swift'
      - 'Info.plist'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "=== repo root contents ==="
          ls -la
          echo ""
          echo "=== main.swift preview ==="
          head -20 main.swift

      - name: Build Swift project
        run: |
          swiftc -o NetTray main.swift -framework AppKit

      - name: Verify build output
        run: |
          ls -la NetTray
          file NetTray

      - name: Create zip archive
        run: |
          zip -r NetTray-macOS.zip NetTray Info.plist
          ls -la NetTray-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetTray-macOS
          path: NetTray-macOS.zip
          retention-days: 30
